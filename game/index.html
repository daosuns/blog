<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Кіт і Лис — гра на двох</title>
<meta name="description" content="Гра на двох з різних телефонів: кіт і лис гуляють полянкою.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<header class="site-header">
    <div class="wrap">
        <a class="logo" href="../">HR<span>me</span> Blog</a>
        <span class="tagline">Гра на двох</span>
    </div>
</header>

<main class="wrap game">

    <p class="status" id="status" role="status" aria-live="polite">Підключення…</p>

    <!-- Start screen -->
    <section id="lobby" hidden>
        <h1>Кіт і Лис</h1>
        <p class="hint">Гра на двох з різних телефонів. Створіть кімнату, оберіть героя й надішліть посилання другові.</p>
        <button class="btn btn-primary" id="create">Створити гру</button>

        <form class="join" id="join-form" autocomplete="off">
            <label for="join-code">Або введіть код кімнати</label>
            <div class="join-row">
                <input id="join-code" inputmode="text" maxlength="4" placeholder="K7F2" autocapitalize="characters" spellcheck="false">
                <button class="btn" type="submit">Увійти</button>
            </div>
        </form>
    </section>

    <!-- Character choice -->
    <section id="pick" hidden>
        <h1>Ким ти будеш?</h1>
        <p class="hint">Друг, який приєднається, гратиме за іншого героя.</p>
        <div class="chars">
            <button class="char-card" data-role="cat" type="button">
                <canvas width="20" height="20" data-preview="cat"></canvas>
                <span>Кіт</span>
            </button>
            <button class="char-card" data-role="fox" type="button">
                <canvas width="20" height="20" data-preview="fox"></canvas>
                <span>Лис</span>
            </button>
        </div>
        <a class="leave" href="./">Назад</a>
    </section>

    <!-- Waiting for the second player -->
    <section id="waiting" hidden>
        <div class="room-bar">
            <div>
                <span class="room-label">Кімната</span>
                <strong class="room-code" data-room-code></strong>
            </div>
            <button class="btn btn-small" data-share>Надіслати посилання</button>
        </div>
        <div class="waiting-hero">
            <canvas width="20" height="20" id="waiting-preview"></canvas>
            <p id="waiting-text"></p>
        </div>
        <a class="leave" href="./">Вийти з кімнати</a>
    </section>

</main>

<!-- The meadow -->
<section id="play" hidden>
    <canvas id="stage"></canvas>
    <div class="hud">
        <div class="pill" id="hud-status"></div>
        <a class="pill pill-btn" href="./" aria-label="Вийти з гри">✕</a>
    </div>
    <div class="touch-hint" id="touch-hint">Тягни пальцем по екрану, щоб іти</div>
</section>

<script type="module" src="game.js"></script>
</body>
</html>
