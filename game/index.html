<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Хрестики-нулики на двох — HRme</title>
<meta name="description" content="Гра на двох з різних телефонів: створіть кімнату й надішліть посилання.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<header class="site-header">
    <div class="wrap">
        <a class="logo" href="../">HR<span>me</span> Blog</a>
        <span class="tagline">Гра на двох</span>
    </div>
</header>

<main class="wrap game">

    <p class="status" id="status" role="status" aria-live="polite">Підключення…</p>

    <!-- Start screen -->
    <section id="lobby" hidden>
        <h1>Хрестики-нулики на двох</h1>
        <p class="hint">Створіть кімнату й надішліть посилання другові — він відкриє його на своєму телефоні.</p>
        <button class="btn btn-primary" id="create">Створити гру</button>

        <form class="join" id="join-form" autocomplete="off">
            <label for="join-code">Або введіть код кімнати</label>
            <div class="join-row">
                <input id="join-code" inputmode="text" maxlength="4" placeholder="K7F2" autocapitalize="characters" spellcheck="false">
                <button class="btn" type="submit">Увійти</button>
            </div>
        </form>
    </section>

    <!-- Room screen -->
    <section id="room" hidden>
        <div class="room-bar">
            <div>
                <span class="room-label">Кімната</span>
                <strong class="room-code" id="room-code"></strong>
            </div>
            <button class="btn btn-small" id="share">Надіслати посилання</button>
        </div>

        <div class="players">
            <div class="player" id="player-X"><span class="mark mark-X">✕</span> <span class="who"></span> <b class="score"></b></div>
            <div class="player" id="player-O"><span class="mark mark-O">◯</span> <span class="who"></span> <b class="score"></b></div>
        </div>

        <div class="board" id="board" role="grid" aria-label="Ігрове поле"></div>

        <button class="btn btn-primary" id="rematch" hidden>Зіграти ще раз</button>
        <a class="leave" href="./">Вийти з кімнати</a>
    </section>

</main>

<script type="module" src="game.js"></script>
</body>
</html>
